<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Maths Test — International, CBSE &amp; ICSE</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #16213b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 14px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 760px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: clamp(16px, 4vw, 28px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .board-btn {
    padding: 18px 10px;
    border-radius: 12px;
    border: 2px solid #334155;
    background: var(--card2);
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .board-btn small { display: block; font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .board-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .grade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; margin-top: 18px; }
  .grade-btn {
    padding: 14px 6px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: var(--card2);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .grade-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .grade-btn.selected { background: var(--accent); color: #082f49; border-color: var(--accent); }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  button.primary {
    flex: 1;
    min-width: 140px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b1120;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost {
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
  .progress { height: 8px; background: #0b1120; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width .25s; }
  .question { font-size: clamp(1.05rem, 4.5vw, 1.3rem); font-weight: 600; margin-bottom: 18px; line-height: 1.5; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: var(--card2);
    color: var(--text);
    font-size: 1.02rem;
    cursor: pointer;
    transition: border-color .12s, background .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.picked { border-color: var(--accent); background: rgba(56,189,248,.12); }
  .opt.correct { border-color: var(--good); background: rgba(74,222,128,.12); }
  .opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.12); }
  .score-big { font-size: clamp(2.2rem, 10vw, 3rem); font-weight: 800; text-align: center; }
  .verdict { text-align: center; font-size: 1.1rem; margin: 8px 0 18px; }
  .review-item { border-top: 1px solid #334155; padding: 12px 0; font-size: 0.95rem; }
  .review-item .q { font-weight: 600; margin-bottom: 4px; }
  .ok { color: var(--good); }
  .no { color: var(--bad); }
  .tag { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; background: #334155; color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .hidden { display: none; }
  @media (max-width: 480px) {
    body { padding: 16px 10px; }
    .grade-grid { grid-template-columns: repeat(3, 1fr); }
    .board-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧮 Maths Test</h1>
    <p>Choose your board, pick your class, take the test!</p>
  </header>

  <!-- STEP 1: Board selection -->
  <section id="board-screen" class="card">
    <h2>Step 1 — Choose your board / mode</h2>
    <div class="board-grid">
      <button class="board-btn" data-board="intl">🌍 International<small>General curriculum, Grades 1–12</small></button>
      <button class="board-btn" data-board="cbse">🇮🇳 CBSE<small>NCERT syllabus, Classes 1–12</small></button>
      <button class="board-btn" data-board="icse">🇮🇳 ICSE<small>CISCE syllabus, Classes 1–10</small></button>
    </div>
  </section>

  <!-- STEP 2: Grade selection -->
  <section id="grade-screen" class="card hidden">
    <h2>Step 2 — Select your <span id="grade-label">grade</span></h2>
    <div class="grade-grid" id="grade-grid"></div>
    <div class="actions">
      <button class="ghost" id="back-to-boards">← Change board</button>
      <button class="primary" id="start-btn" disabled>Start Test ▶</button>
    </div>
  </section>

  <!-- STEP 3: Quiz -->
  <section id="quiz-screen" class="card hidden">
    <div class="qmeta">
      <span id="q-counter">Question 1 of 10</span>
      <span id="q-board"></span>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="question" id="q-text"></div>
    <div id="q-options"></div>
    <div class="actions">
      <button class="primary" id="next-btn" disabled>Next ▶</button>
    </div>
  </section>

  <!-- STEP 4: Results -->
  <section id="results-screen" class="card hidden">
    <div class="score-big" id="score-big"></div>
    <div class="verdict" id="verdict"></div>
    <div class="actions">
      <button class="primary" id="retry-btn">🔄 Try Again</button>
      <button class="ghost" id="change-btn">Change board / class</button>
    </div>
    <h3 style="margin:22px 0 6px;">Answer review</h3>
    <div id="review"></div>
  </section>
</div>

/* ============================================================ */
const boardScreen = document.getElementById('board-screen');
const gradeScreen = document.getElementById('grade-screen');
const quizScreen  = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');
const gradeGrid = document.getElementById('grade-grid');
const startBtn = document.getElementById('start-btn');
const nextBtn = document.getElementById('next-btn');

let board = null, grade = null, questions = [], idx = 0, picked = null, answers = [];

const BOARD_NAMES = { intl: "🌍 International", cbse: "🇮🇳 CBSE", icse: "🇮🇳 ICSE" };
const GRADE_WORD = { intl: "Grade", cbse: "Class", icse: "Class" };

function show(el) {
  [boardScreen, gradeScreen, quizScreen, resultsScreen].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* Step 1: board buttons */
document.querySelectorAll('.board-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    board = btn.dataset.board;
    grade = null;
    buildGradeGrid();
    show(gradeScreen);
  });
});

document.getElementById('back-to-boards').addEventListener('click', () => show(boardScreen));

/* Step 2: grades */
function buildGradeGrid() {
  gradeGrid.innerHTML = '';
  document.getElementById('grade-label').textContent = GRADE_WORD[board].toLowerCase();
  const grades = Object.keys(BANKS[board]).map(Number).sort((a,b) => a - b);
  grades.forEach(g => {
    const b = document.createElement('button');
    b.className = 'grade-btn';
    b.textContent = `${GRADE_WORD[board]} ${g}`;
    b.addEventListener('click', () => {
      grade = g;
      gradeGrid.querySelectorAll('.grade-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      startBtn.disabled = false;
    });
    gradeGrid.appendChild(b);
  });
  startBtn.disabled = true;
}

startBtn.addEventListener('click', () => {
  questions = BANKS[board][grade];
  idx = 0; answers = [];
  document.getElementById('q-board').textContent = `${BOARD_NAMES[board]} · ${GRADE_WORD[board]} ${grade}`;
  show(quizScreen);
  renderQuestion();
});

/* Step 3: quiz */
function renderQuestion() {
  const q = questions[idx];
  picked = null;
  nextBtn.disabled = true;
  nextBtn.textContent = idx === questions.length - 1 ? 'Finish ✔' : 'Next ▶';
  document.getElementById('q-counter').textContent = `Question ${idx + 1} of ${questions.length}`;
  document.getElementById('progress-bar').style.width = `${(idx / questions.length) * 100}%`;
  document.getElementById('q-text').textContent = q.q;
  const box = document.getElementById('q-options');
  box.innerHTML = '';
  q.o.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.addEventListener('click', () => {
      picked = i;
      box.querySelectorAll('.opt').forEach(x => x.classList.remove('picked'));
      b.classList.add('picked');
      nextBtn.disabled = false;
    });
    box.appendChild(b);
  });
}

nextBtn.addEventListener('click', () => {
  answers.push(picked);
  if (idx < questions.length - 1) { idx++; renderQuestion(); }
  else showResults();
});

/* Step 4: results */
function showResults() {
  const score = answers.filter((a, i) => a === questions[i].a).length;
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-big').textContent = `${score} / ${questions.length} (${pct}%)`;
  let verdict, cls;
  if (pct >= 90)      { verdict = "🏆 Outstanding! You're a maths star!"; cls = 'ok'; }
  else if (pct >= 70) { verdict = "🎉 Great job! Solid understanding.";   cls = 'ok'; }
  else if (pct >= 50) { verdict = "👍 Good effort — keep practising!";    cls = '';  }
  else                { verdict = "📚 Keep going — practice makes perfect!"; cls = 'no'; }
  const v = document.getElementById('verdict');
  v.textContent = verdict;
  v.className = 'verdict ' + cls;

  const review = document.getElementById('review');
  review.innerHTML = '';
  questions.forEach((q, i) => {
    const correct = answers[i] === q.a;
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML =
      `<div class="q">${i + 1}. ${q.q} <span class="tag">${correct ? '✓ correct' : '✗ wrong'}</span></div>` +
      `<div class="${correct ? 'ok' : 'no'}">Your answer: ${q.o[answers[i]] ?? '—'}</div>` +
      (correct ? '' : `<div class="ok">Correct answer: ${q.o[q.a]}</div>`);
    review.appendChild(div);
  });
  show(resultsScreen);
}

document.getElementById('retry-btn').addEventListener('click', () => {
  idx = 0; answers = [];
  show(quizScreen);
  renderQuestion();
});
document.getElementById('change-btn').addEventListener('click', () => show(boardScreen));
</script>
